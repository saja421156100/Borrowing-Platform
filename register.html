<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing Platform - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-indigo { background-color: #4f46e5 !important; }
        .btn-indigo { background-color: #4f46e5; color: #fff; border: none; }
        .btn-indigo:hover { background-color: #4338ca; color: #fff; }
        .text-indigo { color: #4f46e5 !important; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none fw-bold fs-4 text-indigo">📦 Borrowing Platform</a>
                </div>

                <div class="card shadow-sm border-0 p-4 rounded-4">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold">Create Account</h4>
                        <p class="text-muted small">Join our community to share and borrow items</p>
                    </div>
                    <form action="login.html" method="GET">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold">Email address</label>
                            <input type="email" class="form-control" id="email" placeholder="user@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label small fw-bold">Phone Number</label>
                            <input type="text" class="form-control" id="phone" placeholder="+970..." required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="********" required>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-indigo py-2">Register</button>
                        </div>
                        <div class="text-center">
                            <p class="text-muted small">Already have an account? <a href="login.html" class="text-indigo text-decoration-none fw-bold">Login here</a></p>
                        </div>
                    </form>
                </div>

                <div class="text-center mt-3">
                    <a href="index.html" class="text-muted small text-decoration-none">&larr; Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
