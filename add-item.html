<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing Platform - Add New Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📦 Borrowing Platform</a>
            <div class="d-flex">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Form Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <div class="mb-4">
                        <h3 class="fw-bold">Add a New Item</h3>
                        <p class="text-muted">List an item you own and make it available for other users to borrow.</p>
                    </div>

                    <!-- Add Item Form (Redirects to dashboard after adding) -->
                    <form action="dashboard.html" method="GET">
                        <div class="mb-3">
                            <label for="itemName" class="form-label">Item Name</label>
                            <input type="text" class="form-control" id="itemName" placeholder="e.g., Canon DSLR Camera" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="" selected disabled>Select category...</option>
                                    <option value="1">Electronics</option>
                                    <option value="2">Tools & Equipment</option>
                                    <option value="3">Books</option>
                                    <option value="4">Camping & Outdoor</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="condition" class="form-label">Condition</label>
                                <select class="form-select" id="condition" required>
                                    <option value="" selected disabled>Select condition...</option>
                                    <option value="brand_new">Brand New</option>
                                    <option value="like_new">Like New</option>
                                    <option value="good">Good</option>
                                    <option value="fair">Fair</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="4" placeholder="Provide details about the item..." required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Borrowing Price (Optional)</label>
                                <input type="number" step="0.01" class="form-control" id="price" placeholder="0.00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="image" class="form-label">Item Image</label>
                                <input type="file" class="form-control" id="image">
                            </div>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary btn-lg">Publish Item</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
