<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            500: "#7038f5",
                            600: "#5e22e7"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="min-h-screen flex flex-col bg-gray-50 pt-16">

<div id="navbar"></div>

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

    <h1 class="text-3xl font-extrabold">
        My profile
    </h1>

    <p class="mt-2 text-sm text-gray-500">
        Manage your personal information.
    </p>


    <div class="mt-8 grid gap-6 lg:grid-cols-[280px_1fr]">

        <aside class="rounded-2xl border border-gray-100 bg-white p-6 text-center shadow-sm">

            <div class="mx-auto flex h-24 w-24 items-center justify-center rounded-full bg-violet-100 text-2xl font-extrabold text-violet-600">
                SA
            </div>

            <h2 class="mt-4 text-xl font-bold">
                Sara Ahmed
            </h2>

            <p class="mt-1 text-xs text-gray-400">
                Member since May 2023
            </p>

            <div class="mt-4">
                ⭐ 4.9
            </div>

            <div class="mt-6 grid grid-cols-2 gap-2">

                <div class="rounded-xl bg-gray-50 p-3">
                    <strong>12</strong>
                    <p class="text-[10px] text-gray-400">
                        Items listed
                    </p>
                </div>

                <div class="rounded-xl bg-gray-50 p-3">
                    <strong>36</strong>
                    <p class="text-[10px] text-gray-400">
                        Borrows
                    </p>
                </div>

            </div>

        </aside>


        <section class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-8">

            <div class="flex justify-between">

                <h2 class="font-bold">
                    Personal information
                </h2>

                <button class="text-sm font-semibold text-violet-600">
                    Edit profile
                </button>

            </div>


            <div class="mt-6 grid gap-5 sm:grid-cols-2">

                <div>
                    <label class="text-xs font-semibold text-gray-500">
                        Full name
                    </label>

                    <div class="mt-2 rounded-xl bg-gray-50 px-4 py-3 text-sm">
                        Sara Ahmed
                    </div>
                </div>


                <div>
                    <label class="text-xs font-semibold text-gray-500">
                        Email
                    </label>

                    <div class="mt-2 rounded-xl bg-gray-50 px-4 py-3 text-sm">
                        sara.ahmed@example.com
                    </div>
                </div>


                <div>
                    <label class="text-xs font-semibold text-gray-500">
                        Phone
                    </label>

                    <div class="mt-2 rounded-xl bg-gray-50 px-4 py-3 text-sm">
                        +1 555 018 293
                    </div>
                </div>


                <div>
                    <label class="text-xs font-semibold text-gray-500">
                        Location
                    </label>

                    <div class="mt-2 rounded-xl bg-gray-50 px-4 py-3 text-sm">
                        Downtown
                    </div>
                </div>

            </div>


            <div class="mt-8 border-t border-gray-100 pt-7">

                <h2 class="font-bold">
                    About me
                </h2>

                <p class="mt-3 max-w-2xl text-sm leading-6 text-gray-500">
                    Photography enthusiast, occasional camper and happy
                    Borrowly community member.
                </p>

            </div>

        </section>

    </div>

</main>

    <div id="footer"></div>


    <script src="assets/js/data.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
        document.getElementById("navbar").innerHTML = navbar();
        document.getElementById("footer").innerHTML = footer();

        document.getElementById("categories").innerHTML =
            BORROWLY_CATEGORIES.map(categoryCard).join("");

        document.getElementById("popularItems").innerHTML =
            BORROWLY_ITEMS.slice(0, 4).map(itemCard).join("");
    </script>

</body>
</html>
