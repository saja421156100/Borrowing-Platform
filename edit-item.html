<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing Platform - Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-indigo { background-color: #4f46e5 !important; }
        .btn-indigo { background-color: #4f46e5; color: #fff; border: none; }
        .btn-indigo:hover { background-color: #4338ca; color: #fff; }
        .text-indigo { color: #4f46e5 !important; }
        .nav-link.active { font-weight: bold; color: #4f46e5 !important; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Fixed Navbar -->
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm border-bottom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-indigo" href="index.html">📦 Borrowing Platform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link text-secondary" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="add-item.html">Add Item</a></li>
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="incoming-requests.html">Incoming Requests</a></li>
                </ul>
                <ul class="navbar-nav align-items-center gap-2">
                    <li class="nav-item"><a class="btn btn-outline-secondary btn-sm px-3" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-indigo btn-sm px-3" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1 pt-5 mt-4">
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0 p-4 rounded-4">
                        <div class="mb-4">
                            <h3 class="fw-bold">Edit Item Details</h3>
                            <p class="text-muted">Update the information of your item.</p>
                        </div>
                        <form action="dashboard.html" method="GET">
                            <div class="mb-3">
                                <label for="itemName" class="form-label small fw-bold">Item Name</label>
                                <input type="text" class="form-control" id="itemName" value="Professional DSLR Camera" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="category" class="form-label small fw-bold">Category</label>
                                    <select class="form-select" id="category" required>
                                        <option value="1" selected>Electronics</option>
                                        <option value="2">Tools & Equipment</option>
                                        <option value="3">Books</option>
                                        <option value="4">Camping & Outdoor</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="condition" class="form-label small fw-bold">Condition</label>
                                    <select class="form-select" id="condition" required>
                                        <option value="brand_new">Brand New</option>
                                        <option value="like_new" selected>Like New</option>
                                        <option value="good">Good</option>
                                        <option value="fair">Fair</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label small fw-bold">Description</label>
                                <textarea class="form-control" id="description" rows="4" required>Canon EOS 80D with 18-55mm lens, perfect for short photography projects.</textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label small fw-bold">Borrowing Price (Optional)</label>
                                    <input type="number" step="0.01" class="form-control" id="price" value="0.00">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="image" class="form-label small fw-bold">Item Image</label>
                                    <input type="file" class="form-control" id="image">
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <button type="submit" class="btn btn-indigo btn-lg w-50">Save Changes</button>
                                <a href="dashboard.html" class="btn btn-outline-secondary btn-lg w-50 text-center">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-dark text-center py-3 mt-auto border-top">
        <div class="container">
            <p class="mb-0 small text-muted">&copy; 2026 Borrowing Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
