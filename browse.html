<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Items — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            100: "#ebe3ff",
                            500: "#7038f5",
                            600: "#5e22e7",
                            700: "#4d18c2"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="min-h-screen flex flex-col bg-gray-50 pt-16">

<div id="navbar"></div>

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

    <div class="mb-8">
        <p class="text-xs font-bold uppercase tracking-widest text-violet-600">
            Marketplace
        </p>

        <h1 class="mt-2 text-3xl font-extrabold">
            Browse items
        </h1>

        <p class="mt-2 text-sm text-gray-500">
            Find useful things shared by people in your community.
        </p>
    </div>


    <div class="grid gap-6 lg:grid-cols-[230px_1fr]">

        <!-- FILTER SIDEBAR -->
        <aside class="hidden rounded-2xl border border-gray-100 bg-white p-5 shadow-sm lg:block">

            <h3 class="font-bold">
                Categories
            </h3>

            <div class="mt-4 space-y-1">

                <a href="browse.html"
                   class="block rounded-xl bg-violet-50 px-3 py-2.5 text-sm font-semibold text-violet-600">
                    All categories
                </a>

                <script>
                    document.write(
                        BORROWLY_CATEGORIES.map(category => `
                            <a
                                href="browse.html?category=${encodeURIComponent(category.name)}"
                                class="block rounded-xl px-3 py-2.5 text-sm text-gray-500 hover:bg-gray-50">
                                ${category.name}
                            </a>
                        `).join("")
                    );
                </script>

            </div>

            <div class="my-6 h-px bg-gray-100"></div>

            <h3 class="font-bold">
                Price per day
            </h3>

            <input
                type="range"
                min="0"
                max="50"
                class="mt-6 w-full accent-violet-600"
            >

            <div class="mt-2 flex justify-between text-xs text-gray-400">
                <span>$0</span>
                <span>$50+</span>
            </div>

        </aside>


        <!-- RESULTS -->
        <section>

            <div id="search"></div>

            <div class="mt-5 flex flex-wrap gap-2">

                <select class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm">
                    <option>All Categories</option>
                    <option>Electronics</option>
                    <option>Tools</option>
                    <option>Camping</option>
                    <option>Sports</option>
                </select>

                <select class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm">
                    <option>Any Status</option>
                    <option>Available</option>
                    <option>Reserved</option>
                </select>

                <select class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm">
                    <option>Recommended</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Highest Rated</option>
                </select>

            </div>


            <div class="mt-7 flex justify-between">

                <p class="text-sm text-gray-500">
                    <strong class="text-gray-900">3,842</strong>
                    items available
                </p>

            </div>


            <div id="itemsGrid"
                 class="mt-5 grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
            </div>

        </section>

    </div>

</main>


<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>

<script>

document.getElementById("navbar").innerHTML = navbar();

document.getElementById("search").innerHTML = searchBar();

document.getElementById("itemsGrid").innerHTML =
    BORROWLY_ITEMS.map(itemCard).join("");

setupBrowse();

</script>
    <div id="footer"></div>


    <script src="assets/js/data.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
        document.getElementById("navbar").innerHTML = navbar();
        document.getElementById("footer").innerHTML = footer();

        document.getElementById("categories").innerHTML =
            BORROWLY_CATEGORIES.map(categoryCard).join("");

        document.getElementById("popularItems").innerHTML =
            BORROWLY_ITEMS.slice(0, 4).map(itemCard).join("");
    </script>

</body>
</html>
