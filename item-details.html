<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Details — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            100: "#ebe3ff",
                            500: "#7038f5",
                            600: "#5e22e7",
                            700: "#4d18c2"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<div id="navbar"></div>

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

    <a href="browse.html"
       class="mb-6 inline-flex text-sm font-semibold text-gray-500 hover:text-violet-600">
        ← Back to browse
    </a>

    <div id="itemDetails"></div>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>

<script>

document.getElementById("navbar").innerHTML = navbar();

const item = getItemFromURL();

document.getElementById("itemDetails").innerHTML = `

<div class="grid gap-8 lg:grid-cols-[1.35fr_.75fr]">

    <div>

        <div class="overflow-hidden rounded-3xl bg-white shadow-sm">
            <img
                src="${item.image}"
                class="h-[340px] w-full object-cover sm:h-[500px]"
            >
        </div>

        <div class="mt-6 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">

            <p class="text-xs font-bold uppercase tracking-widest text-violet-600">
                ${item.category}
            </p>

            <h1 class="mt-2 text-3xl font-extrabold">
                ${item.name}
            </h1>

            <div class="mt-3 flex gap-3">
                ${rating(item.rating)}
                <span class="text-sm text-gray-400">
                    ${item.reviews} reviews
                </span>
            </div>

            <div class="my-6 h-px bg-gray-100"></div>

            <h2 class="font-bold">
                About this item
            </h2>

            <p class="mt-3 text-sm leading-7 text-gray-500">
                ${item.description}
            </p>

            <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4">

                <div class="rounded-xl bg-gray-50 p-4">
                    <p class="text-[10px] text-gray-400">Category</p>
                    <p class="mt-1 text-sm font-semibold">
                        ${item.category}
                    </p>
                </div>

                <div class="rounded-xl bg-gray-50 p-4">
                    <p class="text-[10px] text-gray-400">Location</p>
                    <p class="mt-1 text-sm font-semibold">
                        ${item.location}
                    </p>
                </div>

                <div class="rounded-xl bg-gray-50 p-4">
                    <p class="text-[10px] text-gray-400">Condition</p>
                    <p class="mt-1 text-sm font-semibold">
                        Excellent
                    </p>
                </div>

                <div class="rounded-xl bg-gray-50 p-4">
                    <p class="text-[10px] text-gray-400">Minimum</p>
                    <p class="mt-1 text-sm font-semibold">
                        1 day
                    </p>
                </div>

            </div>

        </div>

    </div>


    <!-- BOOKING CARD -->

    <aside>

        <div class="sticky top-24 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">

            <div class="flex items-start justify-between">

                <div>
                    <p class="text-xs text-gray-400">
                        Rental price
                    </p>

                    <p class="mt-1 text-3xl font-extrabold">
                        $${item.price}
                        <span class="text-sm font-medium text-gray-400">
                            / day
                        </span>
                    </p>
                </div>

                ${statusBadge(item.status)}

            </div>


            <div class="mt-6">

                <label class="text-xs font-semibold">
                    Borrowing dates
                </label>

                <div class="mt-2 grid grid-cols-2 gap-2">

                    <input
                        type="date"
                        class="rounded-xl border border-gray-200 px-3 py-3 text-sm"
                    >

                    <input
                        type="date"
                        class="rounded-xl border border-gray-200 px-3 py-3 text-sm"
                    >

                </div>

            </div>


            <div class="mt-5 rounded-xl bg-violet-50 p-4">

                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">
                        3 days × $${item.price}
                    </span>

                    <span class="font-semibold">
                        $${item.price * 3}
                    </span>
                </div>

                <div class="mt-2 flex justify-between text-sm">
                    <span class="text-gray-500">
                        Borrowly fee
                    </span>

                    <span class="font-semibold">
                        $${Math.round(item.price * .3)}
                    </span>
                </div>

                <div class="mt-3 flex justify-between border-t border-violet-100 pt-3">

                    <span class="font-bold">
                        Total
                    </span>

                    <span class="font-extrabold text-violet-600">
                        $${item.price * 3 + Math.round(item.price * .3)}
                    </span>

                </div>

            </div>


            <button
                onclick="openModal(
                    'Borrow request sent',
                    'Your request has been sent to ${item.owner}.'
                )"
                class="mt-5 w-full rounded-xl bg-violet-600 py-3.5 text-sm font-bold text-white">
                Request to borrow
            </button>


            <div class="mt-5 flex items-center gap-3 border-t border-gray-100 pt-5">

                ${avatar(item.owner)}

                <div>
                    <p class="text-sm font-bold">
                        ${item.owner}
                    </p>

                    <p class="text-xs text-gray-400">
                        Member since 2023 · 4.9 rating
                    </p>
                </div>

                <a href="messages.html"
                   class="ml-auto rounded-xl border border-gray-200 p-2">
                    💬
                </a>

            </div>

        </div>

    </aside>

</div>

`;

</script>

</body>
</html>
