<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            500: "#7038f5",
                            600: "#5e22e7"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<main class="hero-gradient min-h-screen">

    <div class="mx-auto grid min-h-screen max-w-6xl items-center gap-10 px-4 py-8 lg:grid-cols-2">

        <section class="hidden lg:block">

            <a href="index.html" class="flex items-center gap-2 font-bold">
                <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-violet-600 text-white">
                    B
                </span>
                Borrowly
            </a>

            <div class="mt-20">

                <p class="font-semibold text-violet-600">
                    Welcome back!
                </p>

                <h1 class="mt-3 max-w-md text-5xl font-extrabold leading-tight">
                    Glad to see you again
                </h1>

                <p class="mt-5 max-w-md text-sm leading-6 text-gray-500">
                    Log in to your account and continue your borrowing journey.
                </p>

            </div>

        </section>


        <section class="mx-auto w-full max-w-md">

            <div class="rounded-3xl border border-gray-100 bg-white p-6 shadow-xl sm:p-8">

                <h2 class="text-2xl font-extrabold">
                    Log in to your account
                </h2>

                <p class="mt-2 text-sm text-gray-400">
                    Welcome back to Borrowly.
                </p>


                <form
                    class="mt-7"
                    onsubmit="event.preventDefault(); window.location.href='index.html';"
                >

                    <label class="text-xs font-semibold">
                        Email
                    </label>

                    <input
                        required
                        type="email"
                        class="mt-2 mb-4 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm"
                        placeholder="Enter your email"
                    >


                    <label class="text-xs font-semibold">
                        Password
                    </label>

                    <input
                        required
                        type="password"
                        class="mt-2 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm"
                        placeholder="Enter your password"
                    >


                    <div class="mt-4 flex justify-between text-xs">

                        <label class="flex gap-2 text-gray-500">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#"
                           class="font-semibold text-violet-600">
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="mt-6 w-full rounded-xl bg-violet-600 py-3.5 text-sm font-bold text-white">
                        Log in
                    </button>

                </form>
                <p class="mt-6 text-center text-xs text-gray-400">

                    Don't have an account?

                    <a href="signup.html"
                       class="font-bold text-violet-600">
                        Sign up
                    </a>

                </p>

            </div>

        </section>

    </div>

</main>

</body>
</html>
