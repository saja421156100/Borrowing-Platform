<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Borrowly</title>


    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>


    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        violet: {

                            50: "#f5f1ff",
                            100: "#ebe3ff",
                            500: "#7038f5",
                            600: "#5e22e7",
                            700: "#4d18c2"

                        }

                    }

                }

            }

        }

    </script>


    <link rel="stylesheet" href="assets/css/styles.css">


    <!-- Additional styling -->


</head>


<body>


<main class="login-background">


    <div class="main-container">


        <div
            class="desktop-layout grid grid-cols-2 items-center gap-16"
        >


            <!-- ================================= -->
            <!-- LEFT SIDE -->
            <!-- ================================= -->

            <section class="left-side">


                <!-- Logo -->

                <a
                    href="index.html"
                    class="logo"
                >

                    <span class="logo-box">
                        B
                    </span>

                    <span>
                        Borrowly
                    </span>

                </a>





                <!-- Welcome Text -->

                <div class="welcome-text">


                    <p class="welcome-small">

                        Welcome back!

                    </p>


                    <h1 class="welcome-title">

                        Glad to see
                        <br>
                        you again

                    </h1>


                    <p class="welcome-description">

                        Log in to your account and continue
                        your borrowing journey.

                    </p>


                </div>

                <!-- Borrowing Image -->

                <div class="image-container">

                    <img
                        src="assets/images/borrowing-image.png"
                        alt="Borrowing and sharing items"
                        class="borrowing-image"
                    >

                </div>
            </section>



            <!-- ================================= -->
            <!-- RIGHT SIDE -->
            <!-- ================================= -->

            <section class="right-side">


                <!-- Login Card -->

                <div class="login-card">


                    <h2 class="login-title">

                        Log in to your account

                    </h2>


                    <p class="login-subtitle">

                        Welcome back to Borrowly.

                    </p>



                    <!-- Form -->

                    <form
                        class="form-area"
                        onsubmit="event.preventDefault(); window.location.href='index.html';"
                    >


                        <!-- Email -->

                        <label class="form-label">

                            Email

                        </label>


                        <input
                            required
                            type="email"
                            class="form-input"
                            placeholder="Enter your email"
                        >



                        <!-- Password -->

                        <div class="password-area">

                            <label class="form-label">

                                Password

                            </label>


                            <input
                                required
                                type="password"
                                class="form-input"
                                placeholder="Enter your password"
                            >

                        </div>



                        <!-- Options -->

                        <div class="login-options">


                            <label class="remember">

                                <input
                                    type="checkbox"
                                >

                                <span>
                                    Remember me
                                </span>

                            </label>


                            <a
                                href="#"
                                class="forgot"
                            >

                                Forgot password?

                            </a>


                        </div>



                        <!-- Login Button -->

                        <button
                            type="submit"
                            class="login-button"
                        >

                            Log in

                        </button>


                    </form>



                    <!-- Sign Up -->

                    <p class="signup-text">

                        Don't have an account?

                        <a
                            href="signup.html"
                            class="signup-link"
                        >

                            Sign up

                        </a>

                    </p>


                </div>


            </section>


        </div>


        <!-- ================================= -->
        <!-- MOBILE LOGO -->
        <!-- ================================= -->

        <div class="mobile-logo">


            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-box">

                    B

                </span>

                Borrowly

            </a>


        </div>


    </div>


</main>


</body>

</html>
