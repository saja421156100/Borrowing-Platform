<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Borrowings — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            500: "#7038f5",
                            600: "#5e22e7"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">

</head>

<body class="min-h-screen flex flex-col bg-gray-50 pt-16">

<div id="navbar"></div>

<main class="flex-1 mx-auto w-full max-w-7xl px-4 py-8 sm:px-6">

    <h1 class="text-3xl font-extrabold">
        My Borrowings
    </h1>

    <p class="mt-2 text-sm text-gray-500">
        Track items you've borrowed and upcoming reservations.
    </p>


    <div class="mt-7 grid gap-4 sm:grid-cols-3">

        <div class="rounded-2xl bg-white p-5 shadow-sm">
            <p class="text-xs text-gray-400">
                Active Borrowings
            </p>
            <p class="mt-3 text-3xl font-extrabold">
                2
            </p>
        </div>

        <div class="rounded-2xl bg-white p-5 shadow-sm">
            <p class="text-xs text-gray-400">
                Pending Requests
            </p>
            <p class="mt-3 text-3xl font-extrabold">
                1
            </p>
        </div>

        <div class="rounded-2xl bg-white p-5 shadow-sm">
            <p class="text-xs text-gray-400">
                Completed
            </p>
            <p class="mt-3 text-3xl font-extrabold">
                18
            </p>
        </div>

    </div>


    <div class="mt-7 overflow-hidden rounded-2xl bg-white shadow-sm">

        <div class="overflow-x-auto">

            <table class="w-full min-w-[700px]">

                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-5 py-4 text-left text-xs text-gray-400">
                            Item
                        </th>

                        <th class="px-5 py-4 text-left text-xs text-gray-400">
                            Dates
                        </th>

                        <th class="px-5 py-4 text-left text-xs text-gray-400">
                            Owner
                        </th>

                        <th class="px-5 py-4 text-left text-xs text-gray-400">
                            Status
                        </th>

                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    <tr class="border-t">
                        <td class="px-5 py-4 text-sm font-semibold">
                            Canon EOS 250D
                        </td>

                        <td class="px-5 py-4 text-xs text-gray-500">
                            May 20 – May 23
                        </td>

                        <td class="px-5 py-4 text-xs text-gray-500">
                            Sara Ahmed
                        </td>

                        <td class="px-5 py-4">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                                Approved
                            </span>
                        </td>

                        <td class="px-5 py-4">
                            <a href="item-details.html?id=1"
                               class="text-xs font-semibold text-violet-600">
                                View
                            </a>
                        </td>
                    </tr>


                    <tr class="border-t">
                        <td class="px-5 py-4 text-sm font-semibold">
                            Power Drill
                        </td>

                        <td class="px-5 py-4 text-xs text-gray-500">
                            May 25 – May 27
                        </td>

                        <td class="px-5 py-4 text-xs text-gray-500">
                            Ahmad Nabil
                        </td>

                        <td class="px-5 py-4">
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">
                                Pending
                            </span>
                        </td>

                        <td class="px-5 py-4">
                            <a href="item-details.html?id=2"
                               class="text-xs font-semibold text-violet-600">
                                View
                            </a>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>
    <div id="footer"></div>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/components.js"></script>

    <script>
        document.getElementById("navbar").innerHTML = navbar();
        document.getElementById("footer").innerHTML = footer();

        document.getElementById("categories").innerHTML =
            BORROWLY_CATEGORIES.map(categoryCard).join("");

        document.getElementById("popularItems").innerHTML =
            BORROWLY_ITEMS.slice(0, 4).map(itemCard).join("");
    </script>

</body>
</html>
