<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Items — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            500: "#7038f5",
                            600: "#5e22e7"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<div id="navbar"></div>

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

    <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">

        <div>
            <h1 class="text-3xl font-extrabold">
                My Items
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Manage everything you're currently sharing.
            </p>
        </div>

        <button
            onclick="openModal('Add item','The item creation form will connect to your backend later.')"
            class="rounded-xl bg-violet-600 px-5 py-3 text-sm font-bold text-white">
            + Add Item
        </button>

    </div>


    <div class="mt-7 flex gap-2">

        <button class="rounded-xl bg-violet-600 px-4 py-2 text-xs font-bold text-white">
            All
        </button>

        <button class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-xs">
            Available
        </button>

        <button class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-xs">
            Reserved
        </button>

    </div>


    <div id="items"
         class="mt-7 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
    </div>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>

<script>

document.getElementById("navbar").innerHTML = navbar();

document.getElementById("items").innerHTML =
    BORROWLY_ITEMS.slice(0, 6)
        .map(itemCard)
        .join("");

</script>

</body>
</html>
