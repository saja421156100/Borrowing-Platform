<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Borrow Requests — Borrowly</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                violet: {
                    50: "#f5f1ff",
                    500: "#7038f5",
                    600: "#5e22e7",
                    700: "#4d18c2"
                }
            }
        }
    }
}
</script>

<link rel="stylesheet" href="assets/css/styles.css">

</head>

<body class="min-h-screen flex flex-col bg-gray-50 pt-16">

<div id="navbar"></div>

<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">

    <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <h1 class="text-3xl font-extrabold">
                Borrow Requests
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Review requests from people who want to borrow your items.
            </p>
        </div>

        <label class="w-full sm:w-48">
            <span class="mb-2 block text-xs font-bold text-gray-500">Status</span>
            <select
                id="borrowRequestsFilter"
                class="w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 outline-none focus:border-violet-400">
                <option value="">All requests</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="borrowed">Borrowed</option>
                <option value="returned">Returned</option>
                <option value="rejected">Rejected</option>
            </select>
        </label>
    </div>

    <div
        id="borrowRequestsLoading"
        class="mt-7 rounded-2xl border border-gray-100 bg-white p-10 text-center shadow-sm">
        <div class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-violet-100 border-t-violet-600"></div>
        <p class="mt-3 text-sm font-semibold text-gray-500">Loading requests...</p>
    </div>

    <div
        id="borrowRequestsError"
        class="hidden mt-7 rounded-2xl border border-red-100 bg-red-50 p-5 text-sm font-semibold text-red-600"
        role="alert">
    </div>

    <div
        id="borrowRequestsEmpty"
        class="hidden mt-7 rounded-2xl border border-dashed border-gray-200 bg-white p-12 text-center">
        <div class="text-3xl">📭</div>
        <p class="mt-3 font-bold text-gray-700">No borrow requests found</p>
        <p class="mt-1 text-sm text-gray-400">Requests for your items will appear here.</p>
    </div>

    <div id="borrowRequestsList" class="mt-7 space-y-3"></div>

</main>

<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>

<script>
document.getElementById("navbar").innerHTML = navbar();
setupBorrowRequests();
</script>

</body>
</html>
