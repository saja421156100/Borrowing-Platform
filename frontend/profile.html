<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Borrowly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: { 50: "#f5f1ff", 100: "#ebe3ff", 500: "#7038f5", 600: "#5e22e7", 700: "#4d18c2" }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen flex flex-col bg-gray-50 pt-16 text-gray-900">
<div id="navbar"></div>

<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <h1 class="text-3xl font-extrabold">My profile</h1>
            <p class="mt-2 text-sm text-gray-500">Manage your personal information.</p>
        </div>
        <button id="editProfileButton" type="button" class="hidden rounded-xl bg-violet-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-violet-700">
            Edit profile
        </button>
    </div>

    <div id="profileLoading" class="mt-8 rounded-2xl border border-gray-100 bg-white p-10 text-center text-sm text-gray-500 shadow-sm">
        Loading your profile...
    </div>

    <div id="profileError" class="mt-8 hidden rounded-2xl border border-red-100 bg-red-50 p-5 text-sm font-semibold text-red-600" role="alert"></div>

    <div id="profileContent" class="mt-8 hidden grid gap-6 lg:grid-cols-[280px_1fr]">
        <aside class="rounded-2xl border border-gray-100 bg-white p-6 text-center shadow-sm">
            <div id="profileAvatar" class="mx-auto flex h-24 w-24 items-center justify-center rounded-full bg-violet-100 text-2xl font-extrabold text-violet-600">—</div>
            <h2 id="profileName" class="mt-4 text-xl font-bold">—</h2>
            <p id="profileMemberSince" class="mt-1 text-xs text-gray-400">—</p>

            <div id="profileRating" class="mt-4 text-sm font-semibold text-gray-600">No ratings yet</div>

            <div class="mt-6 grid grid-cols-2 gap-2">
                <div class="rounded-xl bg-gray-50 p-3">
                    <strong id="profileItemsCount">0</strong>
                    <p class="text-[10px] text-gray-400">Items listed</p>
                </div>
                <div class="rounded-xl bg-gray-50 p-3">
                    <strong id="profileBorrowsCount">0</strong>
                    <p class="text-[10px] text-gray-400">Borrows</p>
                </div>
            </div>

            <button
                id="profileLogoutButton"
                type="button"
                class="mt-5 w-full rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-bold text-red-600 transition hover:bg-red-100">
                Log out
            </button>
        </aside>

        <section class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-8">
            <div id="profileView">
                <h2 class="font-bold">Personal information</h2>

                <div class="mt-6 grid gap-5 sm:grid-cols-2">
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Full name</label>
                        <div id="profileViewName" class="mt-2 min-h-[44px] rounded-xl bg-gray-50 px-4 py-3 text-sm">—</div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Email</label>
                        <div id="profileViewEmail" class="mt-2 min-h-[44px] rounded-xl bg-gray-50 px-4 py-3 text-sm">—</div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Phone</label>
                        <div id="profileViewPhone" class="mt-2 min-h-[44px] rounded-xl bg-gray-50 px-4 py-3 text-sm">Not provided</div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Location</label>
                        <div id="profileViewLocation" class="mt-2 min-h-[44px] rounded-xl bg-gray-50 px-4 py-3 text-sm">Not provided</div>
                    </div>
                </div>

                <div class="mt-8 border-t border-gray-100 pt-7">
                    <h2 class="font-bold">About me</h2>
                    <p id="profileViewBio" class="mt-3 max-w-2xl whitespace-pre-wrap text-sm leading-6 text-gray-500">No bio yet.</p>
                </div>
            </div>

            <form id="profileEditForm" class="hidden">
                <div class="flex items-center justify-between gap-4">
                    <h2 class="font-bold">Edit personal information</h2>
                    <button id="cancelProfileEdit" type="button" class="text-sm font-semibold text-gray-500 hover:text-gray-800">Cancel</button>
                </div>

                <div id="profileEditError" class="mt-5 hidden rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-600" role="alert"></div>

                <div class="mt-6 grid gap-5 sm:grid-cols-2">
                    <div>
                        <label for="profileInputName" class="text-xs font-semibold text-gray-500">Full name</label>
                        <input id="profileInputName" required type="text" autocomplete="name" class="mt-2 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400">
                    </div>
                    <div>
                        <label for="profileInputEmail" class="text-xs font-semibold text-gray-500">Email</label>
                        <input id="profileInputEmail" required type="email" autocomplete="email" class="mt-2 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400">
                    </div>
                    <div>
                        <label for="profileInputPhone" class="text-xs font-semibold text-gray-500">Phone</label>
                        <input id="profileInputPhone" type="tel" autocomplete="tel" class="mt-2 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400" placeholder="Optional">
                    </div>
                    <div>
                        <label for="profileInputLocation" class="text-xs font-semibold text-gray-500">Location</label>
                        <input id="profileInputLocation" type="text" autocomplete="address-level2" class="mt-2 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400" placeholder="City or area">
                    </div>
                </div>

                <div class="mt-5">
                    <label for="profileInputBio" class="text-xs font-semibold text-gray-500">About me</label>
                    <textarea id="profileInputBio" rows="5" maxlength="1000" class="mt-2 w-full resize-y rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400" placeholder="Tell the community a little about yourself"></textarea>
                </div>

                <div class="mt-6 flex flex-wrap justify-end gap-3">
                    <button id="profileSaveButton" type="submit" class="rounded-xl bg-violet-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-violet-700 disabled:cursor-not-allowed disabled:opacity-60">Save changes</button>
                </div>
            </form>
        </section>
    </div>
</main>

<div id="footer"></div>

<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script>
    document.getElementById("navbar").innerHTML = navbar();
    document.getElementById("footer").innerHTML = footer();
    setupProfile();
</script>
</body>
</html>
