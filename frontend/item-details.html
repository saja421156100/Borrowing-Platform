<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            100: "#ebe3ff",
                            500: "#7038f5",
                            600: "#5e22e7",
                            700: "#4d18c2"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="min-h-screen flex flex-col bg-gray-50 pt-16">
    <div id="navbar"></div>

    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">
        <a href="browse.html" class="mb-6 inline-flex text-sm font-semibold text-gray-500 hover:text-violet-600">
            ← Back to browse
        </a>

        <div id="itemDetailsLoading" class="rounded-2xl border border-gray-100 bg-white p-12 text-center shadow-sm">
            <p class="font-bold text-gray-700">Loading item...</p>
            <p class="mt-2 text-sm text-gray-400">Getting the latest item details from Borrowly.</p>
        </div>

        <div id="itemDetailsError" class="hidden rounded-2xl border border-red-100 bg-red-50 p-6 text-sm text-red-600"></div>

        <div id="itemDetails"></div>
    </main>

    <div id="footer"></div>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById("navbar").innerHTML = navbar();
        document.getElementById("footer").innerHTML = footer();
        setupItemDetails();
    </script>
</body>
</html>
