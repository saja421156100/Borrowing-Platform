<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Items — Borrowly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: { 50: "#f5f1ff", 500: "#7038f5", 600: "#5e22e7", 700: "#4d1bc0" }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50 pt-16 text-gray-900">
    <div id="navbar"></div>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
        <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
            <div>
                <h1 class="text-3xl font-extrabold">My Items</h1>
                <p class="mt-2 text-sm text-gray-500">Manage everything you're currently sharing.</p>
            </div>

            <a href="add-item.html" class="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-600 px-5 py-3 font-semibold text-white transition hover:bg-violet-700">
                <span class="text-xl">+</span> Add Item
            </a>
        </div>

        <div id="myItemsError" class="mt-6 hidden rounded-2xl border border-red-100 bg-red-50 p-4 text-sm text-red-700"></div>

        <div class="mt-7 flex flex-wrap gap-2" id="myItemsFilters">
            <button data-my-items-status="" class="rounded-xl bg-violet-600 px-4 py-2 text-xs font-bold text-white">All</button>
            <button data-my-items-status="available" class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-xs font-semibold text-gray-600">Available</button>
            <button data-my-items-status="unavailable" class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-xs font-semibold text-gray-600">Reserved</button>
            <button data-my-items-status="borrowed" class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-xs font-semibold text-gray-600">Borrowed</button>
        </div>

        <div id="myItemsLoading" class="mt-10 rounded-2xl border border-gray-100 bg-white p-10 text-center text-sm text-gray-500 shadow-sm">Loading your items...</div>

        <div id="myItemsEmpty" class="mt-10 hidden rounded-3xl border border-dashed border-gray-200 bg-white p-12 text-center">
            <div class="text-4xl">📦</div>
            <h2 class="mt-4 text-lg font-bold">No items here yet</h2>
            <p class="mt-2 text-sm text-gray-500">Add something you own and make it available to the Borrowly community.</p>
            <a href="add-item.html" class="mt-5 inline-flex rounded-xl bg-violet-600 px-5 py-3 text-sm font-bold text-white">Add your first item</a>
        </div>

        <div id="myItemsList" class="mt-7 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

        <div id="myItemsPagination" class="mt-8 hidden items-center justify-between rounded-2xl border border-gray-100 bg-white p-4 shadow-sm">
            <button id="myItemsPrev" type="button" class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-40">Previous</button>
            <span id="myItemsPageInfo" class="text-sm text-gray-500"></span>
            <button id="myItemsNext" type="button" class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-40">Next</button>
        </div>
    </main>

    <div id="footer"></div>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById("navbar").innerHTML = navbar();
        document.getElementById("footer").innerHTML = footer();
        setupMyItems();
    </script>
</body>
</html>
