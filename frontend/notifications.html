<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Borrowly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            500: "#7038f5",
                            600: "#5e22e7"
                        }
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen flex flex-col bg-gray-50 pt-16">
    <div id="navbar"></div>

    <main class="mx-auto w-full max-w-4xl flex-1 px-4 py-8 sm:px-6">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
            <div>
                <p class="text-xs font-bold uppercase tracking-widest text-violet-600">Activity</p>
                <h1 class="mt-2 text-3xl font-extrabold text-gray-900">Notifications</h1>
                <p class="mt-2 text-sm text-gray-500">Stay up to date with requests, approvals, handoffs, and returns.</p>
            </div>

            <button id="markAllNotificationsRead"
                    type="button"
                    class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-bold text-gray-700 transition hover:border-violet-200 hover:text-violet-600 disabled:cursor-not-allowed disabled:opacity-50">
                Mark all as read
            </button>
        </div>

        <div class="mt-7 flex gap-2">
            <button type="button"
                    data-notification-filter="all"
                    class="rounded-xl bg-violet-600 px-4 py-2.5 text-sm font-bold text-white transition">
                All
            </button>
            <button type="button"
                    data-notification-filter="unread"
                    class="rounded-xl bg-white px-4 py-2.5 text-sm font-bold text-gray-600 transition hover:text-violet-600">
                Unread
            </button>
        </div>

        <div id="notificationsError"
             class="mt-6 hidden rounded-2xl border border-red-100 bg-red-50 p-5 text-sm font-semibold text-red-600"
             role="alert"></div>

        <div id="notificationsLoading"
             class="mt-6 rounded-2xl border border-gray-100 bg-white p-12 text-center shadow-sm">
            <div class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-violet-100 border-t-violet-600"></div>
            <p class="mt-3 text-sm font-semibold text-gray-500">Loading notifications...</p>
        </div>

        <div id="notificationsList"
             class="mt-6 hidden overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"></div>

        <div id="notificationsPagination" class="mt-8 hidden items-center justify-center gap-3">
            <button id="notificationsPrevPage"
                    type="button"
                    class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 disabled:cursor-not-allowed disabled:opacity-40">
                ← Previous
            </button>
            <span id="notificationsPageLabel" class="text-sm text-gray-500"></span>
            <button id="notificationsNextPage"
                    type="button"
                    class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 disabled:cursor-not-allowed disabled:opacity-40">
                Next →
            </button>
        </div>
    </main>

    <div id="footer"></div>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById("navbar").innerHTML = navbar();
        document.getElementById("footer").innerHTML = footer();
        setupNotifications();
    </script>
</body>
</html>
