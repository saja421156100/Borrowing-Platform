<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Items — Borrowly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{violet:{50:'#f5f1ff',500:'#7038f5',600:'#5e22e7',700:'#4d18c2'}}}}}</script>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-gray-50">
<div class="flex min-h-screen"><div id="sidebar"></div><div class="min-w-0 flex-1"><div id="header"></div>
<main class="p-4 sm:p-6 lg:p-8">
    <div id="adminPageError" class="mb-6 hidden rounded-2xl border border-red-100 bg-red-50 p-4 text-sm font-semibold text-red-600"></div>
    <div class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
        <div><h1 class="text-2xl font-extrabold">Items</h1><p class="mt-1 text-xs text-gray-400">Moderate listings and manage categories.</p></div>
        <div class="grid gap-2 sm:grid-cols-3">
            <input id="adminItemsSearch" type="search" placeholder="Search items..." class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm outline-none focus:border-violet-500">
            <select id="adminItemsStatus" class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm"><option value="">All statuses</option><option value="available">Available</option><option value="unavailable">Reserved</option><option value="borrowed">Borrowed</option></select>
            <select id="adminItemsCategory" class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm"><option value="">All categories</option></select>
        </div>
    </div>

    <section class="mt-6 rounded-2xl border border-violet-100 bg-violet-50/40 p-5">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
            <div><h2 class="font-bold">Categories</h2><p class="mt-1 text-xs text-gray-400">Create, rename, or remove empty categories.</p></div>
            <form id="adminCategoryForm" class="flex gap-2"><input id="adminCategoryName" required maxlength="255" placeholder="New category name" class="rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm outline-none"><button class="rounded-xl bg-violet-600 px-4 py-2.5 text-xs font-bold text-white">Add category</button></form>
        </div>
        <div id="adminCategoryList" class="mt-4 flex flex-wrap gap-2"></div>
    </section>

    <div class="mt-6 overflow-hidden rounded-2xl bg-white shadow-sm"><div class="overflow-x-auto"><table class="w-full min-w-[950px]"><thead class="bg-gray-50"><tr>
        <th class="px-5 py-4 text-left text-xs text-gray-400">Item</th><th class="px-5 py-4 text-left text-xs text-gray-400">Owner</th><th class="px-5 py-4 text-left text-xs text-gray-400">Category</th><th class="px-5 py-4 text-left text-xs text-gray-400">Status</th><th class="px-5 py-4 text-left text-xs text-gray-400">Reviews</th><th class="px-5 py-4 text-left text-xs text-gray-400">Added</th><th class="px-5 py-4 text-right text-xs text-gray-400">Action</th>
    </tr></thead><tbody id="adminItemsRows"><tr><td colspan="7" class="p-10 text-center text-sm text-gray-400">Loading items...</td></tr></tbody></table></div></div>
    <div class="mt-5 flex items-center justify-end gap-3"><button id="adminItemsPrev" class="rounded-xl border bg-white px-4 py-2 text-xs font-bold disabled:opacity-40">Previous</button><span id="adminItemsPage" class="text-xs text-gray-400"></span><button id="adminItemsNext" class="rounded-xl border bg-white px-4 py-2 text-xs font-bold disabled:opacity-40">Next</button></div>
</main></div></div>
<script src="../assets/js/components.js"></script><script src="../assets/js/app.js"></script>
<script>document.getElementById('sidebar').innerHTML=adminSidebar();document.getElementById('header').innerHTML=adminHeader('Items');setupAdminItems();</script>
</body></html>
