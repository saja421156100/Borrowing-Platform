```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — Borrowly</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        violet: {
                            50: "#f5f1ff",
                            100: "#ebe3ff",
                            500: "#7038f5",
                            600: "#5e22e7",
                            700: "#4d18c2"
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/styles.css">

</head>


<body>

<main class="hero-gradient min-h-screen">


    <div class="mx-auto grid min-h-screen max-w-6xl items-center gap-10 px-4 py-8 lg:grid-cols-2">


        <!-- ================= LEFT SIDE ================= -->

        <section class="hidden lg:flex flex-col justify-center">

            <!-- Logo -->

            <a href="index.html" class="flex items-center gap-2">

                <span class="h-9 w-9 rounded-lg bg-violet-600 text-white flex items-center justify-center font-bold">
                    B
                </span>

                <span class="font-bold text-lg">
                    Borrowly
                </span>

            </a>


            <!-- Borrowing Image -->

            <div class="mt-10 flex justify-center">

                <img
                    src="assets/images/borrowing.png"
                    alt="Borrowing and sharing items"
                    class="w-full max-w-lg object-contain"
                >

            </div>


            <!-- Text below image -->

            <div class="mt-4">

                <p class="font-semibold text-violet-600">
                    Join our community
                </p>

                <h1 class="mt-2 max-w-md text-4xl font-extrabold leading-tight">

                    Start sharing &
                    <br>
                    borrowing today

                </h1>

                <p class="mt-4 max-w-md text-sm leading-6 text-gray-500">

                    Create your account and discover amazing items
                    near you.

                </p>

            </div>

        </section>


        <!-- ================= RIGHT SIDE ================= -->

        <section class="mx-auto w-full max-w-md">


            <!-- Mobile Logo -->

            <div class="mb-6 flex items-center gap-2 lg:hidden">

                <a href="index.html"
                   class="flex items-center gap-2 font-bold">

                    <span class="h-8 w-8 rounded-lg bg-violet-600 text-white flex items-center justify-center font-bold">
                        B
                    </span>

                    Borrowly

                </a>

            </div>


            <!-- Signup Card -->

            <div class="rounded-3xl border border-gray-100 bg-white p-6 shadow-xl sm:p-8">


                <h2 class="text-2xl font-extrabold">

                    Create your account

                </h2>


                <p class="mt-2 text-sm text-gray-400">

                    Join thousands of people sharing locally.

                </p>


                <form
                    class="mt-7"
                    onsubmit="event.preventDefault(); window.location.href='browse.html';"
                >


                    <!-- Full Name -->

                    <label class="text-xs font-semibold">

                        Full Name

                    </label>

                    <input
                        required
                        type="text"
                        class="mt-2 mb-4 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400"
                        placeholder="Enter your full name"
                    >


                    <!-- Email -->

                    <label class="text-xs font-semibold">

                        Email

                    </label>

                    <input
                        required
                        type="email"
                        class="mt-2 mb-4 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400"
                        placeholder="Enter your email"
                    >


                    <!-- Phone Number -->

                    <label class="text-xs font-semibold">

                        Phone Number

                    </label>

                    <input
                        type="tel"
                        class="mt-2 mb-4 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400"
                        placeholder="Enter your phone number"
                    >


                    <!-- Password -->

                    <label class="text-xs font-semibold">

                        Password

                    </label>

                    <input
                        required
                        type="password"
                        class="mt-2 mb-4 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400"
                        placeholder="Create a password"
                    >


                    <!-- Confirm Password -->

                    <label class="text-xs font-semibold">

                        Confirm Password

                    </label>

                    <input
                        required
                        type="password"
                        class="mt-2 mb-5 w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none focus:border-violet-400"
                        placeholder="Confirm your password"
                    >


                    <!-- Terms -->

                    <label class="flex gap-2 text-xs text-gray-500">

                        <input
                            required
                            type="checkbox"
                            class="mt-0.5 accent-violet-600"
                        >

                        I agree to the Terms of Service and Privacy Policy

                    </label>


                    <!-- Sign Up -->

                    <button
                        type="submit"
                        class="mt-5 w-full rounded-xl bg-violet-600 py-3.5 text-sm font-bold text-white hover:bg-violet-700 transition"
                    >

                        Sign Up

                    </button>


                </form>


                <!-- Login -->

                <p class="mt-6 text-center text-xs text-gray-400">

                    Already have an account?

                    <a
                        href="login.html"
                        class="font-bold text-violet-600"
                    >

                        Log in

                    </a>

                </p>


            </div>

        </section>

    </div>

</main>

</body>

</html>
```
